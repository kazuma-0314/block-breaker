<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>ブロック崩し</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p class="eyebrow">MINI ARCADE</p>
        <h1>ブロック崩し</h1>
      </div>
      <div class="score-panel" aria-live="polite">
        <div><span>スコア</span><strong id="score">0</strong></div>
        <div><span>残り</span><strong id="lives">3</strong></div>
      </div>
    </header>

    <section class="game-wrap">
      <canvas id="game" width="800" height="600" aria-label="ブロック崩しゲーム"></canvas>
      <div class="overlay" id="overlay">
        <div class="overlay-card">
          <h2 id="message-title">ブロック崩し</h2>
          <p id="message-text">ボールを打ち返して、すべてのブロックを消そう！</p>
          <button id="start-button">ゲーム開始</button>
        </div>
      </div>
    </section>

    <section class="controls">
      <p class="desktop-help">PC：← → キー または A / D キーでパドルを操作</p>
      <p class="mobile-help">スマホ：ゲーム画面を左右にスワイプ、または下のボタンで操作</p>
      <div class="touch-buttons">
        <button class="move-button" id="left-button" aria-label="左へ">◀</button>
        <button class="move-button" id="right-button" aria-label="右へ">▶</button>
      </div>
      <button class="secondary" id="pause-button">一時停止</button>
    </section>
    <p class="footnote">画面を横向きにすると、スマホでも遊びやすくなります。</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
